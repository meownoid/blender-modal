[project]
name = "blender-modal"
version = "4.0.0"
description = "A direct Modal CLI for cached Blender GPU renders"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["modal>=1.5.4,<2", "rich>=13,<16"]

[dependency-groups]
dev = ["mypy>=1.17.0,<2", "pytest>=8.4.0,<9", "ruff>=0.12.0,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blender_modal"]

# Keep a complete Docker build context in the installed package, including the
# Python sources that the Dockerfile installs inside the remote image.
[tool.hatch.build.targets.wheel.force-include]
"Dockerfile" = "blender_modal/_image/Dockerfile"
".dockerignore" = "blender_modal/_image/.dockerignore"
"renderer" = "blender_modal/_image/renderer"
"third_party/flip-fluids" = "blender_modal/_image/third_party/flip-fluids"
"pyproject.toml" = "blender_modal/_image/pyproject.toml"
"README.md" = "blender_modal/_image/README.md"
"blender_modal" = "blender_modal/_image/blender_modal"

[project.scripts]
blender-modal = "blender_modal.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["blender_modal"]
